<!doctype html>
<html lang="en" data-auth="__PIPOD_AUTH_REQUIRED__">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiPod Audio Player</title>
<style>
  :root{font:16px system-ui,sans-serif;color-scheme:dark;background:#111827;color:#f9fafb}
  body{max-width:760px;margin:2rem auto;padding:0 1rem}h1{font-size:1.8rem}
  button,input{font:inherit}button{cursor:pointer;background:#374151;color:inherit;border:1px solid #6b7280;border-radius:.4rem;padding:.5rem .8rem}
  button:hover{background:#4b5563}input{padding:.5rem;background:#1f2937;color:inherit;border:1px solid #6b7280;border-radius:.4rem}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:1rem 0}
  .item{display:block;width:100%;text-align:left;margin:.35rem 0}.muted{color:#9ca3af}#message{min-height:1.5rem}
  progress{width:100%;height:1rem}
</style>
<h1>PiPod Audio Player</h1>
<p class="muted">Upload music to the Pi. Folders and songs appear on the MacroPad automatically.</p>
<div class="bar"><button id="back">← Back</button><strong id="path">Music</strong><button id="refresh">Refresh</button></div>
<div id="items"></div>
<h2>Add music</h2>
<div class="bar"><input id="files" type="file" accept="audio/*,.flac,.opus,.aiff" multiple><button id="upload">Upload files</button></div>
<progress id="progress" value="0" max="100" hidden></progress>
<div class="bar"><input id="folder" placeholder="New folder name"><button id="create">Create folder</button></div>
<p id="message" role="status"></p>
<script>
let folder = "";
const authRequired = document.documentElement.dataset.auth === "true";
let token = authRequired ? (sessionStorage.getItem("pipodToken") || sessionStorage.getItem("jukeboxToken") || prompt("PiPod access token") || "") : "";
if (authRequired) sessionStorage.setItem("pipodToken", token);
const $ = id => document.getElementById(id);
function msg(value){ $("message").textContent = value; }
async function api(url, options={}) {
  options.headers = {...options.headers};
  if (authRequired) options.headers.Authorization = "Bearer " + token;
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) {
    if (response.status === 401) { sessionStorage.removeItem("pipodToken"); sessionStorage.removeItem("jukeboxToken"); msg("Access denied. Reload to enter the token again."); }
    throw Error(data.error || "Request failed");
  }
  return data;
}
async function load(){
  try {
    const data = await api("/api/list?path=" + encodeURIComponent(folder));
    $("path").textContent = "Music" + (folder ? "/" + folder : "");
    $("items").replaceChildren();
    if (!data.items.length) $("items").textContent = "This folder is empty.";
    for (const item of data.items) {
      const row = document.createElement("button");
      row.className = "item";
      row.textContent = (item.directory ? "📁 " : "♫ ") + item.name;
      if (item.directory) row.onclick = () => {folder = [folder,item.name].filter(Boolean).join("/");load();};
      else row.disabled = true;
      $("items").append(row);
    }
  } catch(e) {msg(e.message);}
}
$("back").onclick=()=>{folder=folder.split("/").slice(0,-1).join("/");load();};
$("refresh").onclick=load;
$("create").onclick=async()=>{
  try {
    const name=$("folder").value.trim();
    await api("/api/mkdir?path="+encodeURIComponent(folder)+"&name="+encodeURIComponent(name),{method:"POST"});
    $("folder").value="";msg("Folder created.");await load();
  } catch(e){msg(e.message);}
};
$("upload").onclick=async()=>{
  const files=[...$("files").files];
  if (!files.length){msg("Choose one or more audio files.");return;}
  $("progress").hidden=false;
  for (let i=0;i<files.length;i++) {
    const file=files[i];msg(`Uploading ${file.name} (${i+1}/${files.length})…`);
    try {
      await api("/api/upload?path="+encodeURIComponent(folder)+"&name="+encodeURIComponent(file.name),
                {method:"POST",body:file,headers:{"Content-Type":"application/octet-stream"}});
      $("progress").value=Math.round((i+1)*100/files.length);
    } catch(e){msg(`${file.name}: ${e.message}`);return;}
  }
  $("files").value="";msg("Upload complete.");await load();
};
load();
</script>
